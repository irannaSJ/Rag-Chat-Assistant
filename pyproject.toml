[project]
name = "rag-chat-assistant"
version = "0.1.0"
description = "RAG chat assistant with FastAPI, Streamlit, FAISS, and local LLM integration"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "requests",
  "pickle-mixin",
  "PyPDF2",
  "beautifulsoup4",
  "sentence-transformers",
  "transformers",
  "torch",
  "faiss-cpu",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "streamlit",
  "pydantic",
]

[tool.uv]
package = false
