[project]
name = "rag-chat-assistant"
version = "0.2.0"
description = "Multi-document RAG chat assistant with FastAPI, React, FAISS, and Groq"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "requests",
  "pypdf",
  "beautifulsoup4",
  "fastembed",
  "faiss-cpu",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "pydantic",
  "groq",
  "python-dotenv",
]

[tool.uv]
package = false